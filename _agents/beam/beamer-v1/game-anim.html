<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beamer V1 — Game Animation</title>
<style>
:root{--bg:#0d0a0e;--panel:rgba(255,255,255,.04);--text:#f5f0f0;--sub:#c9b8bc;--muted:#8a7a80;--border:rgba(255,255,255,.08);--gold:#d4af37;--rose:#f0dce2;--team:#e31837;--team2:#ffb81c;--good:#3ecf8e;--bad:#ff6b6b;--motion:250ms ease}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#000;color:var(--text);padding:0;overflow:hidden;height:100vh}
.ov{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a1014 0%,#0d0a0e 70%);display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.team{display:flex;align-items:center;gap:8px}.team b{font-size:.9rem}.sc{font-size:1.6rem;font-weight:900;margin-left:8px}
.qchip{padding:4px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--border);font-size:.75rem;font-weight:700}
.log{flex:1;overflow:auto;padding:12px 16px;font-size:.8rem}
.line{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.line .t{color:var(--muted);font-size:.7rem;width:46px}
.line .pl{flex:1}.line .pts{color:var(--gold);font-weight:700}
.line.me{background:rgba(212,175,55,.06);border-radius:6px;padding:6px}
.ft{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.btn{padding:8px 16px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;cursor:pointer;font-size:.8rem}
.btn.primary{background:linear-gradient(135deg,var(--gold),#b8941f);color:#0d0a0e;border:none;font-weight:700}
.prog{flex:1;height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:2px}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1014 0%,#0d0a0e 70%);animation:fadeOut 1s ease 3s forwards}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}
.intro h2{font-size:2rem;text-transform:uppercase;letter-spacing:.08em;background:linear-gradient(90deg,var(--gold),var(--rose),#fff,var(--rose),var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 2.5s ease-in-out infinite}
.intro .vs{display:flex;gap:24px;align-items:center;margin:16px 0;font-size:1.4rem}
.intro .skip{margin-top:20px;padding:8px 20px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;cursor:pointer;font-size:.8rem}
.final{padding:12px 16px;text-align:center}
.final b{font-size:1.4rem;color:var(--gold)}
@media(prefers-reduced-motion:reduce){.intro,.line{animation:none!important}}
</style></head><body>
<div class="ov">
<div class="hd">
<div class="team"><span style="font-size:1.4rem">🏈</span><b style="color:#e31837">KC</b><span class="sc">24</span></div>
<span class="qchip">3RD</span>
<div class="team"><span class="sc">21</span><b style="color:#002244">SEA</b><span style="font-size:1.4rem">🏈</span></div>
</div>
<div class="log">
<div class="line"><span class="t">2Q 14:22</span><span class="pl">Mahomes to Kelce · +12</span><span class="pts">+7</span></div>
<div class="line me"><span class="t">2Q 08:10</span><span class="pl">Pacheco run · +8</span><span class="pts">+0</span></div>
<div class="line"><span class="t">3Q 11:05</span><span class="pl">Walker run · +15</span><span class="pts">+7</span></div>
<div class="line me"><span class="t">3Q 04:30</span><span class="pl">Mahomes to Rice · +22</span><span class="pts">+7</span></div>
<div class="line"><span class="t">3Q 01:12</span><span class="pl">FG good · 42 yd</span><span class="pts">+3</span></div>
</div>
<div class="final"><b>FINAL · 24-21</b> <span style="color:var(--good);font-weight:700;margin-left:8px">YOU WON ★</span></div>
<div class="ft">
<button class="btn">Skip</button>
<div class="prog"><i></i></div>
<button class="btn primary">Continue</button>
</div>
<div class="intro">
<h2>Divisional Round</h2>
<div class="vs"><span style="color:#e31837">KC</span><span style="color:var(--muted)">vs</span><span style="color:#002244">SEA</span></div>
<button class="skip">Skip intro</button>
</div>
</div>
</body></html>
