# Minimal CI for colors/ (Architect, 14 Nov 2026). The production build is a GATE since 17 Nov 2026 (Owner: flip it when green; it passed on Node 24 in the last three runs). Tests and the tsc ratchet became GATES on 20 Nov 2026 (Owner: the red suite is a real gate; both are green: 430/430, 89/89 pinned). Action versions and node-version 24 follow the repo's own earlier workflow
# (checkout@v4, setup-node@v4, Node 24; commits c7ab335b, 19e28c13, df8a752e). Do not run this on gh-pages (a publishing branch).
name: ci
on:
  push:
    branches: ['architect/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  colors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: colors
    steps:
      - uses: actions/checkout@v4        # the WHOLE repo: the tests read ../data and ../tools
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: colors/package-lock.json
      - name: "pin-watch falsifier (GATE since 18 Nov 2026: the tool must still fail on its own fixtures; exit codes 0/1/2/3/4 unchanged)"
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin 65673a009b29035e8dc993279be656f12aa40a13
          node tools/pin-watch.mjs --self-test --pin 65673a009b29035e8dc993279be656f12aa40a13
      - name: Install (clean)
        run: npm ci
      - name: Type check (GATE since 20 Nov 2026; ratchet pinned in tsc-baseline.json)
        run: npm run tsc:check
      - name: Tests (GATE since 20 Nov 2026)
        run: npm test
      - name: "Production build (GATE since 17 Nov 2026: a failing build fails the run)"
        run: npm run build
