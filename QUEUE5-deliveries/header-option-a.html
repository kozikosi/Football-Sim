<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Draft Simulator</title>
<style>
  :root { --text:#e8ecf4; --sub:#94a3b8; --accent:#ffb3c6; --rose-soft:#ff6b9d; --border:rgba(255,255,255,.1); }
  body { background:#0a0e17; color:var(--text); margin:0; padding:20px; font-family:system-ui, sans-serif; }
  a.home-link { display:inline-block; text-decoration:none; }
  h1 { font-size:2rem; font-weight:900; background:linear-gradient(90deg,var(--text),var(--accent) 70%); -webkit-background-clip:text; background-clip:text; color:transparent; margin:0; }
  .tagline { color:var(--sub); margin-top:4px; }
  .hero { padding:30px; max-width:900px; margin:40px auto 0; border:1px solid var(--border); border-radius:20px; background:linear-gradient(160deg,rgba(255,107,157,.10),rgba(255,255,255,.03)); }
</style>
</head>
<body>
  <div class="hero">
    <a href="#" class="home-link">
      <h1>NFL Draft Simulator</h1>
      <div class="tagline">Draft your team. Play the season. Win the Super Bowl.</div>
    </a>
  </div>
</body>
</html>
